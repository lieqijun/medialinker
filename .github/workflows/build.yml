name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: windows-amd64
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 整理依赖
        run: |
          go mod tidy
          go version

      - name: 编译 windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p pkg
          go build -trimpath \
            -ldflags "-s -w -X main.appVersion=${{ github.ref_name }}" \
            -o pkg/medialinker.exe .
          ls -lh pkg/

      - name: 打包（exe + config.yaml，双击即用）
        run: |
          cp config.yaml pkg/
          cd pkg
          zip -9 medialinker-windows-amd64.zip medialinker.exe config.yaml
          unzip -l medialinker-windows-amd64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: medialinker-windows-amd64
          path: pkg/medialinker-windows-amd64.zip
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/medialinker-windows-amd64.zip
          generate_release_notes: true
